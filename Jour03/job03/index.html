<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="container">
            <h1>La Plateforme</h1>
            <button>JOUER</button>
            <div class="game">
                <div class="square square-1"><img src="./images/logo1.PNG" alt=""></div>
                <div class="square square-2"><img src="./images/logo2.PNG" alt=""></div>
                <div class="square square-3"><img src="./images/logo3.PNG" alt=""></div>
                <div class="square square-4"><img src="./images/logo4.PNG" alt=""></div>
                <div class="square square-5"><img src="./images/logo5.PNG" alt=""></div>
                <div class="square square-6"><img src="./images/logo6.PNG" alt=""></div>
                <div class="square square-7"><img src="./images/logo7.PNG" alt=""></div>
                <div class="square square-8"><img src="./images/logo8.PNG" alt=""></div>
                <div class="square square-9"></div>
            </div>
            <div class="flex info">
                <div class="counter">Nombre de déplacements: 0 </div>
                <div class="time"> Temps : 0h 0m 0s</div>
            </div>
            <div class="win"></div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="script.js" type="text/Javascript"></script>
</body>
</html>
